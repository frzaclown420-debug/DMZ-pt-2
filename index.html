const DATA=JSON.parse(document.querySelector('#data').textContent),FARMS=DATA.farms,KEY='dmz-grind-v1';

let ui={team:'all',risk:'all',sort:'recommended',reverse:false,mapFarm:'safes',zoom:1},page='money',toastTimer;
function validLog(l){return l&&typeof l.id==='string'&&farm(l.farm)&&Number.isFinite(l.minutes)&&l.minutes>0&&l.minutes<=1440&&['cash','xp','loot','operator'].every(k=>l[k]===null||Number.isFinite(l[k]))&&typeof l.date==='string'}
function validActive(a){return a&&farm(a.farm)&&Number.isFinite(a.elapsed)&&a.elapsed>=0&&(a.started===null||Number.isFinite(a.started))&&Array.isArray(a.done)&&a.done.every(x=>Number.isInteger(x)&&x>=0&&x<farm(a.farm).steps.length)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch{storageOK=false;toast('Storage unavailable. Export your results before closing.')}}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),4000)}
function go(hash){if(location.hash==='#'+hash)render();else location.hash=hash}
function elapsed(){const a=store.active;return a?a.elapsed+(a.started===null?0:Math.max(0,Date.now()-a.started)):0}
function clock(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function rate(rows,key){const usable=rows.filter(l=>Number.isFinite(l[key]));return usable.length?usable.reduce((s,l)=>s+l[key],0)/usable.reduce((s,l)=>s+l.minutes,0)*60:null}
function heading(title,desc,kicker='DMZ / FARMING FIELD GUIDE',note=''){return `<div class="hero"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${note?`<div class="hero-note">${note}</div>`:''}</div>`}

function btn(label,action,attrs='',cls=''){return `<button type="button" class="${cls}" data-action="${action}" ${attrs}>${label}</button>`}
function gridPos(g){const m=String(g).match(/^([A-J])([1-9])$/);return m?[(7.431+(m[1].charCodeAt(0)-65)*9.509)*8,(12.993+(+m[2]-1)*10.1455)*7.2]:null}
function routePoints(f,reverse=false){return f.steps.map((s,i)=>({s,i,p:s.pos||gridPos(s.grid)})).filter(s=>s.p).sort((a,b)=>reverse?b.i-a.i:a.i-b.i)}
function svgMap(f,mini=false){const pts=routePoints(f,ui.reverse),coordinates=pts.map(p=>p.p),bounds=mini&&pts.length?[Math.max(0,Math.min(...coordinates.map(p=>p[0]))-140),Math.max(0,Math.min(...coordinates.map(p=>p[1]))-110),Math.max(330,Math.max(...coordinates.map(p=>p[0]))-Math.min(...coordinates.map(p=>p[0]))+280),Math.max(230,Math.max(...coordinates.map(p=>p[1]))-Math.min(...coordinates.map(p=>p[1]))+220)]:[0,0,800,720];
if(!pts.length)return `<svg viewBox="0 0 800 300" aria-label="Dynamic objectives have no fixed route"><path class="card-gridline" d="M0 60H800M0 120H800M0 180H800M0 240H800M100 0V300M200 0V300M300 0V300M400 0V300M500 0V300M600 0V300M700 0V300"/><path d="M140 180L270 95L420 195L600 95" fill="none" stroke="#c9ee7b" stroke-width="3" stroke-dasharray="8 10"/>${[[140,180],[270,95],[420,195],[600,95]].map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="18" fill="#c9ee7b"/><text x="${p[0]}" y="${p[1]+5}" text-anchor="middle" fill="#182011" font-size="14">${i+1}</text>`).join('')}<text x="400" y="265" text-anchor="middle" fill="#adb9a5" font-size="13">OBJECTIVE LOCATIONS CHANGE EACH RAID</text></svg>`;
return `<svg viewBox="${bounds.join(' ')}" role="img" aria-label="${esc(f.name)} approximate route" ${mini?'preserveAspectRatio="xMidYMid slice"':''}><image href="${DATA.terrain}" width="800" height="720"/><rect width="800" height="720" fill="#08130b" opacity=".25"/>${!mini?`<g fill="#fff" font-size="12" font-family="monospace">${'ABCDEFGHIJ'.split('').map((c,i)=>`<text x="${gridPos(c+'1')[0]}" y="28" text-anchor="middle">${c}</text>`).join('')}${[1,2,3,4,5,6,7,8,9].map(n=>`<text x="14" y="${gridPos('A'+n)[1]}">${n}</text>`).join('')}</g>`:''}<polyline points="${pts.map(o=>o.p.join(',')).join(' ')}" fill="none" stroke="#101810" stroke-width="9" stroke-linejoin="round"/><polyline points="${pts.map(o=>o.p.join(',')).join(' ')}" fill="none" stroke="#c9ee7b" stroke-width="4" stroke-linejoin="round" stroke-dasharray="9 5"/>${pts.map((o,j)=>`<circle cx="${o.p[0]}" cy="${o.p[1]}" r="${mini?18:17}" fill="#c9ee7b" stroke="#182011" stroke-width="3"/><text x="${o.p[0]}" y="${o.p[1]+5}" text-anchor="middle" fill="#14200e" font-family="monospace" font-weight="bold" font-size="15">${j+1}</text>`).join('')}</svg>`}
function card(f,index){const cashCard=page==='money'&&f.id==='ops';return `<article class="farm-card ${index===0?'featured':''}"><div class="card-map">${svgMap(f,true)}<span class="map-tag">${f.id==='ops'?'LIVE OBJECTIVES':f.id==='bunkers'?'APPROXIMATE SEARCH GRIDS':'MAPPED FARM'}</span></div><div class="card-body"><div class="eyebrow">${esc(f.eyebrow)}</div><h2>${esc(f.name)}</h2><p>${esc(f.pitch)}</p><div class="metric-row"><div class="metric"><strong>${cashCard?'$10k–20k':esc(f.metric)}</strong><small>${cashCard?'published cash / completed Op':esc(f.metricLabel)}</small></div><div class="metric duration"><strong>${esc(f.range)}</strong><small>Combat: ${['','lower','moderate','high'][f.risk]}</small></div></div><div class="pills"><span class="pill risk${f.risk}">${risk(f.risk)}</span><span class="pill">${f.team==='squad'?'Squad favored':'Solo / squad'}</span><span class="pill">${f.type==='money'?'Sellables':f.id==='ops'?'Operator XP':'DMZ XP'}</span></div><div class="card-footer"><small>Source: COD Central<br>${esc(f.sample)}</small>${btn('Open farm ↗','open',`data-id="${f.id}"`,'primary')}</div></div></article>`}
function controls(){return `<div class="toolbar"><div class="segmented" aria-label="Team preference">${[['all','Any team'],['solo','Solo friendly'],['squad','Squad']].map(([id,n])=>btn(n,'team',`data-id="${id}" aria-pressed="${ui.team===id}"`,ui.team===id?'selected':'')).join('')}</div><label class="risk-control">Combat<select id="risk"><option value="all">Any risk</option>${[1,2,3].map(n=>`<option value="${n}" ${ui.risk===String(n)?'selected':''}>Up to ${['','lower','moderate','high'][n]}</option>`).join('')}</select></label><select id="sort" aria-label="Sort farms"><option value="recommended">Recommended order</option><option value="quick" ${ui.sort==='quick'?'selected':''}>Shortest runs first</option></select></div>`}
function browse(kind){let fs=FARMS.filter(f=>kind==='money'?f.type!=='xp':f.type!=='money');if(ui.team==='solo')fs=fs.filter(f=>f.team==='either');if(ui.team==='squad')fs.sort((a,b)=>(b.team==='squad')-(a.team==='squad'));if(ui.risk!=='all')fs=fs.filter(f=>f.risk<=Number(ui.risk));if(ui.sort==='quick')fs.sort((a,b)=>a.minutes-b.minutes);
return heading(kind==='money'?'Make the raid pay.':'More progress. Less wandering.',kind==='money'?'Repeatable money routes, practical stops, and a plan for getting out.':'Choose DMZ level or operator XP. Pick a farm, run the checklist, measure your pace.',kind==='money'?'01 / MONEY FARMS':'02 / XP GRINDS',kind==='money'?'<b>Keep the numbers honest.</b>Loot value is not cash banked. Published results are examples, not promised payouts.':'<b>Choose the right XP.</b>Mission completion XP and operator XP are tracked separately.')+controls()+`<div class="section-row"><h2>${kind==='money'?'Choose your money run':'Choose your XP grind'}</h2><small>${String(fs.length).padStart(2,'0')} CURATED FARMS</small></div><div class="farm-grid">${fs.length?fs.map(card).join(''):'<div class="empty">No farms match these filters. Choose a higher combat limit or Any team.</div>'}</div>`+(kind==='xp'?`<div class="notice"><b>DMZ level:</b> mission repeats. <b>Operator XP:</b> Dynamic Ops. Published timing excludes loading and menus; your log and planner can include that overhead. ${link(DATA.xpSource,'XP breakdown and evidence')}</div>`:`<div class="notice"><b>Your purple $206,000 mask:</b> saved here as a reported find, not a confirmed repeatable farm. There is no verified fixed pickup in this build.</div>`)+`<p class="footnote">Only five focused farms are included. No recipe route currently meets your requirement for verified guaranteed ingredient spawns. Guides checked ${DATA.checked}; results can change with patches.</p>`}
function benchmark(f){if(!f.bench.length)return '<p>No comparable full-run dataset is included. Log your own runs to establish a baseline.</p>';const fields=['min',...['loot','cash','xp'].filter(k=>f.bench.some(b=>Number.isFinite(b[k])))];const names={min:'Minutes',loot:'Backpack value',cash:'Cash banked',xp:'DMZ XP'};return `<div class="table-scroll"><table><thead><tr><th>Run</th>${fields.map(k=>`<th>${names[k]}</th>`).join('')}</tr></thead><tbody>${f.bench.map((b,i)=>`<tr><td>${i+1}</td>${fields.map(k=>`<td>${!Number.isFinite(b[k])?'—':k==='min'?b[k].toFixed(1):k==='xp'?num(b[k]):money(b[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="tiny">Reported by COD Central, not tested in game by us. ${f.id==='ops'?'Examples have different numbers of completed Ops.':''}</p>`}
function steps(f,interactive=false){const indexed=f.steps.map((s,i)=>({s,i}));if(ui.reverse&&['safes','bunkers'].includes(f.id))indexed.reverse();return `<ol class="steps">${indexed.map(({s,i},j)=>{const done=interactive&&store.active?.done.includes(i);return `<li class="step ${done?'done':''}">${interactive?btn(done?'✓':j+1,'tick',`data-i="${i}" aria-label="${esc((done?'Uncheck ':'Complete ')+s.name)}" aria-pressed="${!!done}"`,'number'):`<span class="number">${j+1}</span>`}<div><h3>${esc(s.name)}${s.grid?`<span class="grid">${esc(s.grid)}</span>`:''}</h3><p>${esc(s.note)}</p></div></li>`}).join('')}</ol>`}
function mapPanel(f){return `<section class="panel"><h2>${f.id==='ops'?'Follow the live objective':'Route reference'}</h2><div class="route-map" id="route-map">${svgMap(f)}</div>${f.id!=='ops'?`<div class="map-actions">${btn('−','zoom','data-delta="-1" aria-label="Zoom out"')}${btn('Reset','zoom','data-delta="0"')}${btn('+','zoom','data-delta="1" aria-label="Zoom in"')}<span>Scroll to pan when zoomed</span></div>`:''}<p class="tiny">${f.id==='bunkers'?'Numbered pins are grid centers. Find the entrances using terrain and the linked guide.':f.id==='ops'?'This diagram shows the objective loop, not actual Op locations.':'Only steps with a referenced location appear on the map. Room-level steps use the in-game objective.'} Lines show stop order, not roads or a safe path.</p>${link(DATA.mapSource,'Terrain / location reference')}</section>`}
function detail(id){const f=farm(id);if(!f)return '<div class="empty">Farm not found. <a href="#money">Choose a farm</a></div>';return `<a class="back" href="#${f.type==='xp'?'xp':'money'}">← All ${f.type==='xp'?'XP':'money'} farms</a>`+heading(esc(f.name),esc(f.pitch),esc(f.eyebrow))+`<div class="detail-grid"><div><div class="detail-metrics"><div><strong style="color:var(--lime)">${esc(f.metric)}</strong><small>${esc(f.metricLabel)}</small></div><div><strong>${esc(f.range)}</strong><small>${risk(f.risk)} · ${f.team==='squad'?'Squad favored':'Solo / squad'}</small></div></div><section class="panel"><h2>Deploy with a plan</h2><h3>Starting point / access</h3><p>${esc(f.start)}</p><h3>Bring</h3><ul>${f.kit.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><div class="actions">${btn(store.active?.farm===f.id?'Resume this run →':'Start this farm →','start',`data-id="${f.id}"`,'primary')}${btn('Plan my target','plan',`data-id="${f.id}"`,'ghost')}</div></section><section class="panel"><div class="section-row" style="margin-top:0"><h2>Run order</h2>${['safes','bunkers'].includes(f.id)?btn(ui.reverse?'South → north':'Reverse route','reverse','','ghost tiny'):''}</div>${steps(f)}<h3>Extraction</h3><p>${esc(f.exit)}</p><h3>Repeat / reset</h3><p>${esc(f.repeat)}</p></section><section class="panel"><h2>What is repeatable?</h2><div class="split-proof"><div><b>FIXED / OBJECTIVE</b><p>${esc(f.fixed)}</p></div><div><b>RANDOM / VARIABLE</b><p>${esc(f.random)}</p></div></div>${f.notes.map(n=>`<p class="tiny">${esc(n)}</p>`).join('')}<p class="tiny">Fixed container locations do not guarantee untouched containers or a specific item.</p></section></div><aside class="sticky">${mapPanel(f)}<section class="panel"><h2>Published evidence</h2>${benchmark(f)}${link(f.source,'Read the original guide')}${f.secondSource?link(f.secondSource,'Independent bunker guide; compare grids'):''}${f.id==='ops'?link('https://www.callofduty.com/patchnotes/2026/10/call-of-duty-modern-warfare-4-launch-patch-notes','Official cash payouts: $10k–20k / Op'):''}<div class="source-line">Checked ${DATA.checked}. These are third-party reports; no in-game testing by us.</div></section></aside></div>`}
function routes(){const f=farm(ui.mapFarm)||FARMS[0];return heading('Know the next stop.','Just the farming route. No unrelated map layers.','03 / ROUTE DESK')+`<label>Choose a farm<select id="map-farm" class="run-select">${FARMS.map(r=>`<option value="${r.id}" ${f.id===r.id?'selected':''}>${r.name}</option>`).join('')}</select></label><div class="actions">${btn('Full farm briefing →','open',`data-id="${f.id}"`,'primary')}${['safes','bunkers'].includes(f.id)?btn(ui.reverse?'Restore original order':'Reverse stop order','reverse','','ghost'):''}</div><div class="detail-grid" style="margin-top:22px"><div>${mapPanel(f)}</div><section class="panel"><h2>${esc(f.name)}</h2>${steps(f)}<h3>Getting out</h3><p>${esc(f.exit)}</p></section></div>`}
function planner(id='safes'){return heading('Set the grind.','Estimate with your own pace, then compare it with actual results.','TARGET / SESSION PLANNER')+`<section class="panel" style="max-width:730px"><form id="goal-form"><div class="form-grid"><label class="full">Farm<select name="farm" class="run-select">${FARMS.map(f=>`<option value="${f.id}" ${f.id===id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label><label>Track<select name="track" class="run-select"><option value="cash">Net banked cash</option><option value="xp">DMZ XP</option><option value="operator">Operator XP</option><option value="loot">Backpack value</option></select></label><label>Goal remaining<input name="target" type="number" min="1" max="1000000000" value="100000" required></label><label>Average earned per run<input name="amount" type="number" min="1" max="1000000000" placeholder="Enter your measured amount" required></label><label>Minutes per run<input name="minutes" type="number" min="0.1" max="1440" step="0.1" value="${farm(id)?.minutes||11}" required></label><label>Loading / menus per run<input name="overhead" type="number" min="0" max="120" step="0.1" value="3" required></label><label>Successful-run chance %<input name="success" type="number" min="1" max="100" value="100" required></label></div><div class="actions">${btn('Use my logged averages','averages')}${btn('Estimate session','estimate','','primary')}</div><div id="goal-result" role="status" aria-live="polite"></div><p class="tiny">Your estimate assumes unsuccessful runs earn zero for the chosen track. For XP retained on death, use an all-attempt average and 100%. Cash figures should include your own deployment and replacement costs.</p></form></section>`}
function goalResult(target,amount,minutes,overhead,success){if(![target,amount,minutes,overhead,success].every(Number.isFinite)||target<=0||amount<=0||minutes<=0||overhead<0||success<=0||success>100)throw Error('Enter positive earnings, a target, time, and a success chance from 1–100%.');const expected=amount*success/100,runs=Math.ceil(target/expected),total=runs*(minutes+overhead);return {runs,total,rate:expected/(minutes+overhead)*60}}
function run(){if(!store.active)return heading('One run at a time.','Start a farm to keep its route, checklist and timer here.','04 / ACTIVE RUN')+`<div class="empty">No active farm.<div class="actions" style="justify-content:center"><a class="btn primary" href="#money">Choose money farm</a><a class="btn" href="#xp">Choose XP farm</a></div></div>`;const a=store.active,f=farm(a.farm),done=a.done.length,defaultMin=(elapsed()/60000).toFixed(1);return heading(esc(f.name),'Your checklist and timer stay on this device between visits.','04 / ACTIVE RUN')+`<div class="detail-grid"><div><section class="panel"><div class="run-status"><div><div class="eyebrow">${a.started===null?'PAUSED':'TIMER RUNNING'}</div><div id="clock" class="clock">${clock(elapsed())}</div></div>${btn(a.started===null?'Resume':'Pause','pause','','primary')}</div><div class="progress-track"><div style="width:${done/f.steps.length*100}%"></div></div><small>${done} / ${f.steps.length} steps checked</small>${steps(f,true)}<h3>Extraction</h3><p>${esc(f.exit)}</p></section><section class="panel"><h2>Finish and log your result</h2><form id="log-form"><div class="form-grid"><label>Full run minutes<input name="minutes" type="number" step="0.1" min="0.1" max="1440" value="${+defaultMin>0?defaultMin:''}" placeholder="Include overhead if desired" required></label><label>Outcome<select name="outcome" class="run-select"><option value="extracted">Extracted / completed</option><option value="failed">Failed / died</option><option value="partial">Partial / left early</option></select></label><label>Net banked cash<input name="cash" type="number" min="-1000000000" max="1000000000" placeholder="Blank = not measured"></label><label>Backpack value<input name="loot" type="number" min="0" max="1000000000" placeholder="Blank = not measured"></label><label>DMZ XP earned<input name="xp" type="number" min="0" max="1000000000" placeholder="Blank = not measured"></label><label>Operator XP earned<input name="operator" type="number" min="0" max="1000000000" placeholder="Blank = not measured"></label><label class="full">Run note<input name="note" maxlength="220" placeholder="A detour, contested safe, actual mask sale…"></label></div><p class="tiny">Leave unmeasured fields blank. A zero is a measured zero. Net cash = Bank after − Bank before, including your costs.</p><button class="primary wide">Save result and finish run</button></form><div class="actions">${btn('Discard active run','discard','','ghost danger')}</div></section></div><aside>${mapPanel(f)}<section class="panel"><h2>Reset rule</h2><p>${esc(f.repeat)}</p>${link(f.source,'Farm evidence')}</section></aside></div>`}
function results(){const logs=store.logs,c=rate(logs,'cash'),x=rate(logs,'xp');return heading('Your numbers win.','Published examples are a starting point. This is your actual farming history.','05 / RESULTS')+`<div class="stat-grid"><div class="stat"><strong>${logs.length}</strong><small>LOGGED RUNS</small></div><div class="stat"><strong>${c===null?'—':money(c)}</strong><small>NET CASH / HOUR</small></div><div class="stat"><strong>${x===null?'—':num(x)}</strong><small>DMZ XP / HOUR</small></div></div><section class="panel"><div class="section-row" style="margin-top:0"><h2>Farm comparison</h2><a href="#planner" class="tiny">Plan a target ↗</a></div>${logs.length?`<div class="table-scroll"><table><thead><tr><th>Farm</th><th>Runs</th><th>Cash / h</th><th>DMZ XP / h</th><th>Operator / h</th></tr></thead><tbody>${FARMS.filter(f=>logs.some(l=>l.farm===f.id)).map(f=>{const rows=logs.filter(l=>l.farm===f.id);return `<tr><td>${esc(f.name)}</td><td>${rows.length}</td>${['cash','xp','operator'].map(k=>`<td>${rate(rows,k)===null?'—':k==='cash'?money(rate(rows,k)):num(rate(rows,k))}</td>`).join('')}</tr>`}).join('')}</tbody></table></div>`:'<p>No results yet. Start a farm and log a completed or failed attempt.</p>'}<p class="tiny">Rates use total measured earnings ÷ minutes for entries where that field was measured. Include failed attempts for a realistic comparison.</p></section><section class="panel"><h2>Recent attempts</h2>${logs.slice().reverse().map(l=>`<div class="result-row"><div><b>${esc(farm(l.farm).name)}</b><small>${esc(l.date.slice(0,10))} · ${l.minutes.toFixed(1)} min · ${esc(l.outcome)}</small>${l.note?`<small>${esc(l.note)}</small>`:''}</div><div><b>${l.cash===null?'Cash —':money(l.cash)}</b><small>${l.xp===null?'XP —':num(l.xp)+' DMZ XP'}</small>${btn('Delete','delete',`data-id="${esc(l.id)}"`,'ghost danger')}</div></div>`).join('')||'<p>Your results will appear here.</p>'}</section><section class="panel"><h2>Keep your history</h2><p>Saved in this browser. Export before moving phones, changing browsers or clearing site data.</p><div class="actions">${btn('Export backup','export')}<label class="btn file-label">Import backup<input id="import" type="file" accept="application/json,.json"></label><a class="btn ghost" href="#planner">Goal planner</a></div></section>`}
function render(){const draft=$('#log-form')?Object.fromEntries([...new FormData($('#log-form'))]):null;if(draft)ui.logDraft=draft;const parts=location.hash.slice(1).split('/');page=parts[0]||'money';if(page==='run'&&store.active)ui.reverse=!!store.active.reverse;const activeTab=page==='farm'?(farm(parts[1])?.type==='xp'?'xp':'money'):page==='planner'?'results':page;$('.tabs').innerHTML=[['money','01','Money'],['xp','02','XP farms'],['routes','03','Routes'],['run','04','My run'],['results','05','Results']].map(([id,n,title])=>`<a href="#${id}" class="${activeTab===id?'active':''}" ${activeTab===id?'aria-current="page"':''}><span>${n}</span>${title}${id==='run'&&store.active?' •':''}</a>`).join('');let html=page==='farm'?detail(parts[1]):page==='routes'?routes():page==='run'?run():page==='results'?results():page==='planner'?planner(parts[1]):browse(page==='xp'?'xp':'money');$('#main').innerHTML=(!storageOK?'<div class="notice">Browser storage is unavailable. Export your results before closing.</div>':'')+html+'<footer>DMZ / GRIND · Independent companion · Five curated farms · No live game data<br>Single-file HTML · Works offline after download · Sources open online</footer>';if(page==='run'&&ui.logDraft&&$('#log-form'))for(const [k,v]of Object.entries(ui.logDraft))if($('#log-form').elements[k])$('#log-form').elements[k].value=v;applyZoom();document.title=(page==='farm'?(farm(parts[1])?.name||'Farm'):page==='xp'?'XP farms':page==='run'?'My run':page==='results'?'Results':page==='routes'?'Routes':page==='planner'?'Goal planner':'Money farms')+' / DMZ Grind'}
function applyZoom(){const svg=$('#route-map svg');if(svg){svg.style.width=ui.zoom*100+'%';svg.style.maxWidth='none'}}
function backupData(b){if(!b||b.format!=='dmz-grind'||b.version!==1||!Array.isArray(b.logs)||b.logs.length>10000||!b.logs.every(validLog))throw Error('This is not a valid DMZ Grind backup.');return b.logs}
function download(name,data){const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action,id=b.dataset.id;
if(act==='open'){ui.reverse=false;ui.zoom=1;go('farm/'+id)}
else if(act==='team'){ui.team=id;render()}
else if(act==='reverse'){ui.reverse=!ui.reverse;render()}
else if(act==='plan')go('planner/'+id);
else if(act==='start'){if(store.active?.farm===id){ui.reverse=!!store.active.reverse;go('run');return}if(store.active&&!confirm('Replace your active run? Its unsaved timer and checklist will be discarded.'))return;ui.logDraft=null;store.active={farm:id,elapsed:0,started:Date.now(),done:[],reverse:ui.reverse};save();go('run')}
else if(act==='tick'){const i=Number(b.dataset.i),a=store.active;a.done=a.done.includes(i)?a.done.filter(n=>n!==i):[...a.done,i];save();render()}
else if(act==='pause'){const a=store.active;if(a.started===null)a.started=Date.now();else{a.elapsed=elapsed();a.started=null}save();render()}
else if(act==='discard'){if(confirm('Discard this active run? Logged results are kept.')){store.active=null;save();render()}}
else if(act==='zoom'){ui.zoom=Number(b.dataset.delta)===0?1:Math.max(1,Math.min(4,ui.zoom+Number(b.dataset.delta)*.5));applyZoom()}
else if(act==='delete'){if(confirm('Delete this logged attempt?')){store.logs=store.logs.filter(l=>l.id!==id);save();render()}}
else if(act==='export')download('dmz-grind-backup.json',{format:'dmz-grind',version:1,logs:store.logs});
else if(act==='averages'){const form=$('#goal-form'),rows=store.logs.filter(l=>l.farm===form.farm.value&&Number.isFinite(l[form.track.value]));if(!rows.length){toast('No measured runs for this farm and track yet.');return}form.amount.value=Math.round(rows.reduce((s,l)=>s+l[form.track.value],0)/rows.length);form.minutes.value=(rows.reduce((s,l)=>s+l.minutes,0)/rows.length).toFixed(1);form.success.value=100;form.overhead.value=0;toast('All-attempt averages filled. Add overhead only if excluded from your log.')}
else if(act==='estimate'){$('#goal-form').requestSubmit()}
});
document.addEventListener('change',async e=>{const t=e.target;if(t.id==='risk'){ui.risk=t.value;render()}else if(t.id==='sort'){ui.sort=t.value;render()}else if(t.id==='map-farm'){ui.mapFarm=t.value;ui.zoom=1;ui.reverse=false;render()}else if(t.id==='import'){try{const file=t.files[0];if(!file)return;if(file.size>5000000)throw Error('Backup is too large.');const logs=backupData(JSON.parse(await file.text()));const seen=new Set(store.logs.map(l=>l.id));for(const l of logs)if(!seen.has(l.id)){store.logs.push(l);seen.add(l.id)}save();render();toast('Backup merged. Duplicate run IDs skipped.')}catch(err){toast(err.message)}t.value=''}});
document.addEventListener('submit',e=>{if(e.target.id==='goal-form'){e.preventDefault();const f=e.target;try{const r=goalResult(+f.elements.target.value,+f.amount.value,+f.minutes.value,+f.overhead.value,+f.success.value);$('#goal-result').innerHTML=`<div class="goal-result"><strong>${r.runs} runs · ${(r.total/60).toFixed(1)} hours</strong><span>Expected pace: ${num(r.rate)} / hour including your entered overhead. An estimate, not a guarantee.</span></div>`}catch(err){toast(err.message)}}else if(e.target.id==='log-form'){e.preventDefault();const f=e.target;if(!store.active)return;const v=k=>f.elements[k].value.trim()===''?null:Number(f.elements[k].value);const log={id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),farm:store.active.farm,date:new Date().toISOString(),minutes:Number(f.minutes.value),outcome:f.outcome.value,note:f.note.value.trim(),cash:v('cash'),loot:v('loot'),xp:v('xp'),operator:v('operator')};if(!validLog(log)){toast('Check your run time and measured values.');return}store.logs.push(log);store.active=null;ui.logDraft=null;save();go('results');toast('Run saved.')}});
window.addEventListener('hashchange',()=>{if(page==='run'&&store.active)ui.reverse=!!store.active.reverse;render();window.scrollTo(0,0)});
document.addEventListener('input',e=>{if(e.target.closest('#log-form')){e.target.dataset.edited='1';ui.logDraft=Object.fromEntries([...new FormData($('#log-form'))])}});
setInterval(()=>{if($('#clock')){$('#clock').textContent=clock(elapsed());const field=$('#log-form')?.elements.minutes;if(field&&!field.dataset.edited&&!ui.logDraft)field.value=Math.max(.1,elapsed()/60000).toFixed(1)}},1000);
if(store.active)ui.reverse=!!store.active.reverse;
render();
</script></body></html>
